server.port=${PORT:8181}
server.error.include-message=never
spring.application.name=uncrud-poll
spring.jackson.deserialization.fail-on-unknown-properties=true
uncrud.environment=${UNCRUD_ENV:local}
uncrud.project-id=${UNCRUD_PROJECT_ID:demo-uncrud}
uncrud.database-id=${UNCRUD_DATABASE_ID:(default)}
uncrud.allowed-origins=${UNCRUD_ALLOWED_ORIGINS:http://127.0.0.1:5174}
