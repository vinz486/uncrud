<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">The vote round trip across two clients</title><desc id="desc">Client A sends a vote. Java verifies and atomically commits private vote, counts, projections and receipt. The HTTP receipt confirms commit; both clients receive independent realtime snapshots.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4d785e"/></marker></defs>
  <rect width="1100" height="530" rx="20" fill="#f3f5ed"/>
  <g font-family="system-ui,sans-serif" fill="#183d31"><text x="36" y="43" font-size="12" letter-spacing="2">UNCRUD / COMMAND LIFECYCLE</text><text x="36" y="78" font-size="26" font-weight="600">The receipt confirms. The projection updates.</text>
    <g stroke="#c6d3be" stroke-dasharray="5 5"><path d="M130 151V480M407 151V480M685 151V480M963 151V480"/></g>
    <g fill="#fff" stroke="#cedac8"><rect x="55" y="105" width="150" height="46" rx="10"/><rect x="332" y="105" width="150" height="46" rx="10"/><rect x="610" y="105" width="150" height="46" rx="10"/><rect x="888" y="105" width="150" height="46" rx="10"/></g>
    <g text-anchor="middle" font-size="15" font-weight="600"><text x="130" y="134">Client A</text><text x="407" y="134">Java API</text><text x="685" y="134">Firestore</text><text x="963" y="134">Client B</text></g>
    <g fill="none" stroke="#4d785e" stroke-width="2" marker-end="url(#arrow)"><path d="M130 202H399"/><path d="M407 322H677"/><path d="M407 365H138"/><path d="M685 416H138"/><path d="M685 450H955"/></g>
    <text x="150" y="189" font-size="12">Vote + ID token + stable command key</text>
    <rect x="329" y="225" width="446" height="68" rx="10" fill="#dfeccf"/><text x="350" y="251" font-size="13" font-weight="600">Verify caller, poll status and personal version</text><text x="350" y="274" font-size="12">Duplicate key + same input → return the original receipt</text>
    <text x="430" y="311" font-size="11">Commit vote + counts + views + receipt</text>
    <rect x="650" y="317" width="70" height="20" rx="5" fill="#1b5140"/>
    <text x="150" y="354" font-size="12">HTTP receipt: commit ID and versions</text><text x="277" y="404" font-size="12">Realtime shared + personal projection</text><text x="741" y="438" font-size="12">Realtime shared projection</text>
    <text x="36" y="506" font-size="11" fill="#71826b">The order of HTTP and listener delivery can vary. Never render counts from the receipt.</text>
  </g>
</svg>
